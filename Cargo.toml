[package]
name = "lat"
version = "0.3.0"
edition = "2024"
authors = ["Dana Schlifka"]
description = "Language-as-Tool: an MCP server that provides curated thinking patterns (languages and poetic forms) to MCP-compatible AI agents."
license = "Apache-2.0"
repository = "https://github.com/nyadyme/lat"
homepage = "https://github.com/nyadyme/lat"
readme = "README.md"

[[bin]]
name = "lat"
path = "src/main.rs"

[dependencies]
rmcp = { version = "2.2", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "macros",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "net",
    "signal",
] }
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[profile.dev]
codegen-units = 32
